<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4 ӘРІПТІ 35 СӨЗДІ ОҚЫ</title><meta property="og:title" content="4 ӘРІПТІ 35 СӨЗДІ ОҚЫ — ИНТЕРАКТИВТІ ОЙЫН"><meta property="og:description" content="Бірінші буыны бір дауыстыдан, екінші буыны бітеу буыннан тұратын 35 сөз. Оқы да, бас!"><meta name="description" content="4 әріптен тұратын 35 сөзді оқуға арналған ойын"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:15px 12px 35px;color:#163765;font-family:'Times New Roman',serif;background:linear-gradient(180deg,#49c9ff 0%,#b8f1ff 44%,#c8f6a4 65%,#77cf4d 100%);background-attachment:fixed}main{max-width:1280px;margin:auto}.title{background:#fff9e9;border:6px solid #ffd35c;border-radius:35px;text-align:center;padding:13px 12px;box-shadow:0 5px 0 #0002}h1{margin:0;color:#16498a;font-size:clamp(28px,4vw,52px);line-height:1.12;font-weight:900}.subtitle{text-align:center;font-size:clamp(20px,2.3vw,30px);font-weight:900;margin:15px 0 7px;color:#153e69}.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px auto 17px;max-width:900px;font-size:clamp(18px,2vw,26px);font-weight:bold}.restart{border:3px solid #29699c;border-radius:14px;background:white;color:#153e69;padding:9px 16px;font:900 20px 'Times New Roman',serif;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}.tile{min-width:0;height:90px;border:5px solid;border-radius:20px;box-shadow:0 5px 0 #0002;font:900 clamp(29px,4.2vw,58px) 'Times New Roman',serif;color:#090909;cursor:pointer;transition:opacity .22s,transform .22s}.tile:nth-child(5n+1){background:#ffe0ec;border-color:#f58eb7}.tile:nth-child(5n+2){background:#fff1b5;border-color:#f6c34c}.tile:nth-child(5n+3){background:#dff6d2;border-color:#9bdb7c}.tile:nth-child(5n+4){background:#d6f1ff;border-color:#7bc7f0}.tile:nth-child(5n){background:#eadcff;border-color:#b995e6}.tile.done{opacity:0;transform:scale(.7);pointer-events:none}.tile:focus-visible,.restart:focus-visible,.start:focus-visible{outline:5px solid #0d46d4;outline-offset:3px}.overlay{position:fixed;inset:0;background:#173b5db8;display:grid;place-items:center;padding:20px;z-index:5}.overlay.hidden{display:none}.panel{background:#fffbea;border:7px solid #ffd35c;border-radius:30px;text-align:center;padding:28px;max-width:650px;width:100%;box-shadow:0 12px 45px #173b5d60}.panel h2{font-size:clamp(34px,5vw,58px);margin:8px 0;color:#16498a}.panel p{font-size:clamp(22px,3vw,32px);font-weight:bold}.start{font:900 clamp(28px,4vw,44px) 'Times New Roman',serif;background:#ed383e;color:white;border:0;border-radius:20px;padding:13px 42px;cursor:pointer;box-shadow:0 5px 0 #a52a2e}@media(max-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tile{height:74px;border-width:3px;font-size:clamp(27px,7vw,42px)}.title{border-radius:20px;border-width:4px}.restart{font-size:16px;padding:7px 10px}}@media(max-width:340px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main><div class="title"><h1>4 ӘРІПТІ СӨЗДЕРДІ ОҚЫ!</h1></div><p class="subtitle">Сөзді оқы да, үстін бас — сөз жоғалады!</p><div class="tools"><span id="count">Оқылғаны: 0 / 35</span><button class="restart" id="restart">ҚАЙТА БАСТАУ</button></div><div class="grid" id="grid"></div></main><div class="overlay" id="overlay"><div class="panel"><h2 id="message">4 ӘРІПТІ СӨЗДЕР</h2><p id="description">35 сөзді оқып, әрқайсысын бас!</p><button class="start" id="start">БАСТА!</button></div></div><script>
const words=["Анар", "Асан", "адам", "адал", "Ажар", "алып", "арық", "ағыс", "амал", "аңыз", "Омар", "Ораз", "орақ", "отан", "орам", "орын", "орыс", "өмір", "өнер", "Әсем", "әдеп", "Әділ", "емен", "егін", "есік", "елік", "есек", "ұран", "ұзын", "ұсақ", "ұлық", "үнем", "үлес", "ырыс", "інім"];const grid=document.getElementById('grid'),count=document.getElementById('count'),overlay=document.getElementById('overlay'),message=document.getElementById('message'),description=document.getElementById('description'),start=document.getElementById('start');let n=0;
function reset(){n=0;count.textContent='Оқылғаны: 0 / '+words.length;grid.innerHTML='';words.forEach(word=>{const tile=document.createElement('button');tile.className='tile';tile.textContent=word;tile.setAttribute('aria-label',word);tile.addEventListener('click',()=>{if(tile.classList.contains('done'))return;tile.classList.add('done');tile.disabled=true;n++;count.textContent='Оқылғаны: '+n+' / '+words.length;if(n===words.length)setTimeout(()=>{overlay.classList.remove('hidden');message.textContent='🌟 ЖАРАЙСЫҢ!';description.textContent='35 сөздің бәрін оқыдың!';start.textContent='ҚАЙТА ОЙНАУ';start.onclick=()=>{reset();overlay.classList.add('hidden')}},300)});grid.appendChild(tile)})}
function welcome(){message.textContent='4 ӘРІПТІ СӨЗДЕР';description.textContent='35 сөзді оқып, әрқайсысын бас!';start.textContent='БАСТА!';start.onclick=()=>overlay.classList.add('hidden');overlay.classList.remove('hidden')}
document.getElementById('restart').onclick=()=>{reset();welcome()};reset();welcome();
</script></body></html>
